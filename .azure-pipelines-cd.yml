# CD Pipeline - Deploy Doctor Dashboard to Azure Container Apps
trigger: none
pr: none

resources:
  pipelines:
  - pipeline: doctor-dashboard-ci
    source: doctor-dashboard-ci
    trigger:
      branches:
      - main
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'zgridcontainerregistry'
  acrResourceGroup: 'Z-INFRA-STACK-DEV'
  imageName: 'doctor-dashboard'
  subscriptionId: '759c3e4d-1b5f-481d-b10d-5d93bf2aaeea'
  resourceGroup: 'Z-INFRA-STACK-DEV'
  containerAppName: 'doctor-dashboard'
  containerAppEnv: 'doctor-dashboard-env'
  location: 'eastus'

stages:
- stage: Deploy_ACA
  displayName: 'Deploy to Azure Container Apps'
  jobs:
  - deployment: DeployACA
    displayName: 'Deploy to Azure Container Apps'
    environment: 'doctor-dashboard-aca'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: none

          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Apps'
            inputs:
              azureSubscription: 'Z-INFRA-STACK-DEV-connection'  # Update with your service connection name
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Deploying doctor-dashboard to Azure Container Apps..."

                # Get the image tag from CI pipeline
                IMAGE_TAG="$(resources.pipeline.doctor-dashboard-ci.runName)"
                if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" == "null" ]; then
                  IMAGE_TAG="latest"
                fi

                FULL_IMAGE="$(acrName).azurecr.io/$(imageName):$IMAGE_TAG"
                echo "Deploying image: $FULL_IMAGE"

                # Update the Container App with new image
                az containerapp update \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --image "$FULL_IMAGE" \
                  --revision-suffix "rev-$(Build.BuildId)" \
                  --set-env-vars NODE_ENV=production PORT=8001

                echo "Deployment completed successfully!"
                echo "Container App: $(containerAppName)"
                echo "Resource Group: $(resourceGroup)"
                echo "Image: $FULL_IMAGE"

- stage: Verify_Deployment
  displayName: 'Verify Deployment'
  dependsOn: Deploy_ACA
  jobs:
  - job: Verify
    displayName: 'Health Check'
    steps:
    - task: AzureCLI@2
      displayName: 'Check Container App Health'
      inputs:
        azureSubscription: 'Z-INFRA-STACK-DEV-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

          # Get the Container App URL
          APP_URL=$(az containerapp show \
            --name $(containerAppName) \
            --resource-group $(resourceGroup) \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "Checking health endpoint: https://$APP_URL/api/health"

          # Health check
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://$APP_URL/api/health || echo "000")
            if [ "$STATUS" == "200" ]; then
              echo "✓ Health check passed!"
              curl -s https://$APP_URL/api/health
              exit 0
            fi
            echo "Attempt $i: Health check returned $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "✗ Health check failed after 10 attempts"
          exit 1

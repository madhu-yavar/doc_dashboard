apiVersion: v1
kind: Service
metadata:
  name: {{ include "doctor-dashboard.fullname" . }}
  namespace: {{ include "doctor-dashboard.namespace" . }}
  labels:
    {{- include "doctor-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "doctor-dashboard.selectorLabels" . | nindent 4 }}

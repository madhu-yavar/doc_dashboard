{{- if or .Values.secrets.geminiApiKey .Values.secrets.smtpUser .Values.secrets.smtpPass .Values.secrets.authBootstrapAdminUsername .Values.secrets.authBootstrapDoctorUsername }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doctor-dashboard.fullname" . }}-secret
  namespace: {{ include "doctor-dashboard.namespace" . }}
  labels:
    {{- include "doctor-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.geminiApiKey }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey }}
  {{- end }}
  {{- if .Values.secrets.smtpUser }}
  smtp-user: {{ .Values.secrets.smtpUser }}
  {{- end }}
  {{- if .Values.secrets.smtpPass }}
  smtp-pass: {{ .Values.secrets.smtpPass }}
  {{- end }}
  {{- if .Values.secrets.authBootstrapAdminUsername }}
  auth-bootstrap-admin-username: {{ .Values.secrets.authBootstrapAdminUsername }}
  {{- end }}
  {{- if .Values.secrets.authBootstrapAdminPasswordHash }}
  auth-bootstrap-admin-password-hash: {{ .Values.secrets.authBootstrapAdminPasswordHash }}
  {{- end }}
  {{- if .Values.secrets.authBootstrapDoctorUsername }}
  auth-bootstrap-doctor-username: {{ .Values.secrets.authBootstrapDoctorUsername }}
  {{- end }}
  {{- if .Values.secrets.authBootstrapDoctorPasswordHash }}
  auth-bootstrap-doctor-password-hash: {{ .Values.secrets.authBootstrapDoctorPasswordHash }}
  {{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doctor-dashboard.fullname" . }}
  namespace: {{ include "doctor-dashboard.namespace" . }}
  labels:
    {{- include "doctor-dashboard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "doctor-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "doctor-dashboard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "doctor-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.networking.fixMtu }}
      initContainers:
      - name: fix-mtu
        image: busybox:1.36
        command: ["/bin/sh", "-c", "ip link set dev eth0 mtu {{ .Values.networking.mtu }} && echo 'MTU set to' $(cat /sys/class/net/eth0/mtu)"]
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: true
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.container.port }}
          protocol: TCP
        {{- if .Values.healthProbes.enabled }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: {{ .Values.healthProbes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthProbes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.healthProbes.liveness.timeoutSeconds }}
          successThreshold: {{ .Values.healthProbes.liveness.successThreshold }}
          failureThreshold: {{ .Values.healthProbes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: {{ .Values.healthProbes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthProbes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.healthProbes.readiness.timeoutSeconds }}
          successThreshold: {{ .Values.healthProbes.readiness.successThreshold }}
          failureThreshold: {{ .Values.healthProbes.readiness.failureThreshold }}
        {{- if .Values.healthProbes.startup.enabled }}
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: {{ .Values.healthProbes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthProbes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.healthProbes.startup.timeoutSeconds }}
          successThreshold: {{ .Values.healthProbes.startup.successThreshold }}
          failureThreshold: {{ .Values.healthProbes.startup.failureThreshold }}
        {{- end }}
        {{- end }}
        env:
        - name: NODE_ENV
          value: {{ .Values.config.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.config.port | quote }}
        - name: GEMMA_URL
          value: {{ .Values.config.gemmaUrl | quote }}
        - name: GEMMA_MODEL
          value: {{ .Values.config.gemmaModel | quote }}
        - name: USE_GEMINI_FOR_EXTERNAL
          value: {{ .Values.config.useGeminiForExternal | quote }}
        - name: GEMINI_MODEL
          value: {{ .Values.config.geminiModel | quote }}
        {{- if .Values.config.gemmaEnableFallback }}
        - name: GEMMA_ENABLE_FALLBACK
          value: {{ .Values.config.gemmaEnableFallback | quote }}
        {{- end }}
        {{- if .Values.config.gemmaFallbackUrl }}
        - name: GEMMA_FALLBACK_URL
          value: {{ .Values.config.gemmaFallbackUrl | quote }}
        {{- end }}
        {{- if .Values.config.gemmaFallbackModel }}
        - name: GEMMA_FALLBACK_MODEL
          value: {{ .Values.config.gemmaFallbackModel | quote }}
        {{- end }}
        {{- if .Values.config.extractionGemmaTimeoutMs }}
        - name: EXTRACTION_GEMMA_TIMEOUT_MS
          value: {{ .Values.config.extractionGemmaTimeoutMs | quote }}
        {{- end }}
        {{- if .Values.config.gemmaTimeoutMs }}
        - name: GEMMA_TIMEOUT_MS
          value: {{ .Values.config.gemmaTimeoutMs | quote }}
        {{- end }}
        {{- if .Values.config.extractionTextBudget }}
        - name: EXTRACTION_TEXT_BUDGET
          value: {{ .Values.config.extractionTextBudget | quote }}
        {{- end }}
        {{- if .Values.config.clinicalExtractionTextBudget }}
        - name: CLINICAL_EXTRACTION_TEXT_BUDGET
          value: {{ .Values.config.clinicalExtractionTextBudget | quote }}
        {{- end }}
        {{- if .Values.config.extractionMaxOutputTokens }}
        - name: EXTRACTION_MAX_OUTPUT_TOKENS
          value: {{ .Values.config.extractionMaxOutputTokens | quote }}
        {{- end }}
        {{- if .Values.config.useAgenticClassification }}
        - name: USE_AGENTIC_CLASSIFICATION
          value: {{ .Values.config.useAgenticClassification | quote }}
        {{- end }}
        {{- if .Values.config.enableTwoStageExtraction }}
        - name: ENABLE_TWO_STAGE_EXTRACTION
          value: {{ .Values.config.enableTwoStageExtraction | quote }}
        {{- end }}
        {{- if .Values.config.enablePhiMasking }}
        - name: ENABLE_PHI_MASKING
          value: {{ .Values.config.enablePhiMasking | quote }}
        {{- end }}
        {{- if .Values.config.handwritingThreshold }}
        - name: HANDWRITING_THRESHOLD
          value: {{ .Values.config.handwritingThreshold | quote }}
        {{- end }}
        {{- if .Values.config.pharmacyAlertsEnabled }}
        - name: PHARMACY_ALERTS_ENABLED
          value: {{ .Values.config.pharmacyAlertsEnabled | quote }}
        {{- end }}
        {{- if .Values.config.sendPharmacyEmail }}
        - name: SEND_PHARMACY_EMAIL
          value: {{ .Values.config.sendPharmacyEmail | quote }}
        {{- end }}
        {{- if .Values.config.pharmacyEmailFrom }}
        - name: PHARMACY_EMAIL_FROM
          value: {{ .Values.config.pharmacyEmailFrom | quote }}
        {{- end }}
        {{- if .Values.config.pharmacyEmailTeam }}
        - name: PHARMACY_EMAIL_TEAM
          value: {{ .Values.config.pharmacyEmailTeam | quote }}
        {{- end }}
        {{- if .Values.config.pharmacyEmailReplyTo }}
        - name: PHARMACY_EMAIL_REPLY_TO
          value: {{ .Values.config.pharmacyEmailReplyTo | quote }}
        {{- end }}
        {{- if .Values.config.sendPharmacyWhatsapp }}
        - name: SEND_PHARMACY_WHATSAPP
          value: {{ .Values.config.sendPharmacyWhatsapp | quote }}
        {{- end }}
        {{- if .Values.config.pharmacyAlertLogOnly }}
        - name: PHARMACY_ALERT_LOG_ONLY
          value: {{ .Values.config.pharmacyAlertLogOnly | quote }}
        {{- end }}
        {{- if .Values.config.departmentAlertsEnabled }}
        - name: DEPARTMENT_ALERTS_ENABLED
          value: {{ .Values.config.departmentAlertsEnabled | quote }}
        {{- end }}
        {{- if .Values.config.departmentEmailFrom }}
        - name: DEPARTMENT_EMAIL_FROM
          value: {{ .Values.config.departmentEmailFrom | quote }}
        {{- end }}
        {{- if .Values.config.departmentEmailReplyTo }}
        - name: DEPARTMENT_EMAIL_REPLY_TO
          value: {{ .Values.config.departmentEmailReplyTo | quote }}
        {{- end }}
        {{- if .Values.config.labEmail }}
        - name: LAB_EMAIL
          value: {{ .Values.config.labEmail | quote }}
        {{- end }}
        {{- if .Values.config.radiologyEmail }}
        - name: RADIOLOGY_EMAIL
          value: {{ .Values.config.radiologyEmail | quote }}
        {{- end }}
        {{- if .Values.config.nuclearMedicineEmail }}
        - name: NUCLEAR_MEDICINE_EMAIL
          value: {{ .Values.config.nuclearMedicineEmail | quote }}
        {{- end }}
        {{- if .Values.config.proceduresEmail }}
        - name: PROCEDURES_EMAIL
          value: {{ .Values.config.proceduresEmail | quote }}
        {{- end }}
        {{- if .Values.config.departmentAlertLogOnly }}
        - name: DEPARTMENT_ALERT_LOG_ONLY
          value: {{ .Values.config.departmentAlertLogOnly | quote }}
        {{- end }}
        {{- if .Values.config.dashboardBaseUrl }}
        - name: DASHBOARD_BASE_URL
          value: {{ .Values.config.dashboardBaseUrl | quote }}
        {{- end }}
        {{- if .Values.secrets.geminiApiKey }}
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "doctor-dashboard.fullname" . }}-secret
              key: gemini-api-key
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: storage
          mountPath: /app/server/storage
      volumes:
      - name: storage
        {{- if .Values.storage.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim }}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "doctor-dashboard.fullname" . }}-storage
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

# Default values for doctor-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: zinfradevv1.azurecr.io/doctor-dashboard
  tag: latest-dev
  pullPolicy: Always

# Deployment configuration
replicaCount: 1

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1        # Maximum number of pods that can be created above desired replicas
    maxUnavailable: 0  # Maximum number of pods that can be unavailable during update

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod configuration
podAnnotations: {}
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: Always

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Service configuration
service:
  type: ClusterIP
  port: 8001

# Ingress configuration
ingress:
  enabled: true
  className: nginx  # Set to your ingress class (e.g., nginx, traefik)
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: doctor-dashboard.zagent.dev.yavar.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
  - secretName: doctor-dashboard-dev-tls-cert
    hosts:
      - doctor-dashboard.zagent.dev.yavar.ai

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistent storage configuration
storage:
  className: ""  # Default storage class will be used if empty
  size: 5Gi
  accessMode: ReadWriteOnce
  annotations: {}

# Container configuration
container:
  port: 8001

# Health probe configuration
healthProbes:
  enabled: true
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  startup:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30

# Application configuration (non-sensitive)
config:
  nodeEnv: production
  port: 8001
  gemmaUrl: http://206.1.62.28:8000/v1/chat/completions
  gemmaModel: google/gemma-4-26B-A4B-it
  useGeminiForExternal: "true"
  geminiModel: gemini-2.5-flash

# Secret configuration (sensitive values)
# These will be stored as Kubernetes secrets
secrets:
  geminiApiKey: ""  # Set via --set-secrets or pre-create secret

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Namespace override (for development/testing)
namespaceOverride: ""

# Networking fix for Azure CNI overlay / PMTU blackhole issue.
# Large HTTP requests (>1150 bytes body) hang due to TCP timestamps + MTU mismatch.
# Setting eth0 MTU=1400 ensures TCP segments stay within the effective path MTU.
networking:
  fixMtu: true
  mtu: 1400

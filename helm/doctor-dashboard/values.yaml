# Default values for doctor-dashboard
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: zinfradevv1.azurecr.io/doctor-dashboard
  tag: latest-dev
  pullPolicy: Always

# Deployment configuration
replicaCount: 1

# Deployment strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0        # Only create new pods after old ones are terminated (prevents SQLite lock conflicts)
    maxUnavailable: 1  # Allow 1 pod to be unavailable during update

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod configuration
podAnnotations: {}
podSecurityContext:
  fsGroup: 1001
  fsGroupChangePolicy: Always

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Service configuration
service:
  type: ClusterIP
  port: 8001

# Ingress configuration
ingress:
  enabled: true
  className: nginx  # Set to your ingress class (e.g., nginx, traefik)
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: doctor-dashboard.zagent.dev.yavar.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
  - secretName: doctor-dashboard-dev-tls-cert
    hosts:
      - doctor-dashboard.zagent.dev.yavar.ai

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistent storage configuration
storage:
  className: "default"  # Use default storage class for ReadWriteOnce support (SQLite compatible)
  size: 20Gi
  accessMode: ReadWriteOnce  # SQLite requires single-pod access for database consistency
  existingClaim: "r-and-d-doctor-dashboard-storage-rwo"  # Use ReadWriteOnce PVC
  annotations: {}

# Container configuration
container:
  port: 8001

# Health probe configuration
healthProbes:
  enabled: true
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  startup:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30

# Application configuration (non-sensitive)
config:
  nodeEnv: production
  port: 8001
  gemmaUrl: http://206.1.62.28:8000/v1/chat/completions
  gemmaModel: google/gemma-4-26B-A4B-it
  useGeminiForExternal: "true"
  geminiModel: gemini-2.5-pro
  # Additional environment variables
  gemmaEnableFallback: "false"
  gemmaFallbackUrl: http://206.1.62.28:8000/v1/chat/completions
  gemmaFallbackModel: google/gemma-4-26B-A4B-it
  extractionGemmaTimeoutMs: "600000"
  gemmaTimeoutMs: "600000"
  extractionTextBudget: "72000"
  clinicalExtractionTextBudget: "50000"
  extractionMaxOutputTokens: "4000"
  useAgenticClassification: "true"
  enableTwoStageExtraction: "true"
  enablePhiMasking: "true"
  handwritingThreshold: "15"
  # Pharmacy alerts configuration
  pharmacyAlertsEnabled: "true"
  sendPharmacyEmail: "true"
  pharmacyEmailFrom: Platforms@yavar.ai
  pharmacyEmailTeam: madhu.r@yavar.ai
  pharmacyEmailReplyTo: Platforms@yavar.ai
  sendPharmacyWhatsapp: "false"
  whatsappAccessToken: ""
  whatsappBusinessAccountId: ""
  pharmacyWhatsappPhoneNumber: ""
  pharmacyAlertLogPath: ./server/storage/pharmacy_alerts.jsonl
  pharmacyAlertLogOnly: "false"
  # Department alerts configuration
  departmentAlertsEnabled: "true"
  departmentEmailFrom: Platforms@yavar.ai
  departmentEmailReplyTo: Platforms@yavar.ai
  labEmail: madhu.r@yavar.ai
  radiologyEmail: madhu.r@yavar.ai
  nuclearMedicineEmail: madhu.r@yavar.ai
  proceduresEmail: madhu.r@yavar.ai
  departmentAlertLogPath: ./server/storage/department_alerts.jsonl
  departmentAlertLogOnly: "false"
  # Dashboard URLs
  dashboardBaseUrl: https://doctor-dashboard.zagent.dev.yavar.ai
  # Frontend configuration
  frontendOrigin: http://localhost:8081
  # Auth configuration
  authCookieSecure: "false"
  # SMTP configuration for email alerts
  smtpHost: smtp.office365.com
  smtpPort: "587"
  smtpSecure: "false"
  smtpRequireTls: "true"
  smtpFromEmail: Platforms@yavar.ai
  smtpReplyTo: Platforms@yavar.ai

# Secret configuration (sensitive values)
# These will be stored as Kubernetes secrets
secrets:
  geminiApiKey: "AIzaSyB7id4gzU0DUBq0xba-y-1U_9oOjLHHTRI"
  smtpUser: "Platforms@yavar.ai"
  smtpPass: "vzfzglzwqyyqthgj"
  # Auth bootstrap credentials
  authBootstrapAdminUsername: "admin"
  authBootstrapAdminPasswordHash: "$2b$10$FxnesBTE8PhN..jBw2uxFuHDRkVY5ON62xP38b8p7pLZ3iIF9qiXu"
  authBootstrapDoctorUsername: "madhu"
  authBootstrapDoctorPasswordHash: "$2b$10$Cf.V36V7AVjzen9tb0cR7uGLRChEI5sBJTapMfn/eWo5eoC56Q8MK"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Namespace override (for development/testing)
namespaceOverride: ""

# Networking fix for Azure CNI overlay / PMTU blackhole issue.
# Large HTTP requests (>1150 bytes body) hang due to TCP timestamps + MTU mismatch.
# Setting eth0 MTU=1400 ensures TCP segments stay within the effective path MTU.
networking:
  fixMtu: true
  mtu: 1400

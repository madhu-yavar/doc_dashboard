# CI Pipeline - Build and Push Docker Image
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - doctor_dashboard/*
    - .azure-pipelines-ci.yml

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'zgridcontainerregistry'
  imageName: 'doctor-dashboard'
  dockerfilePath: 'doctor_dashboard/Dockerfile'
  buildContext: 'doctor_dashboard'

resources:
  repositories:
  - repository: doctor_dashboard
    type: git
    name: Z-Platforms-Infra/r_and_d

stages:
- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: Build
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        repository: $(imageName)
        command: build
        Dockerfile: $(dockerfilePath)
        buildContext: $(buildContext)
        tags: |
          $(Build.BuildId)
          latest
        arguments: '--cache-from=$(imageName):latest'

    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        command: push
        repository: $(imageName)
        tags: |
          $(Build.BuildId)
          latest

    - publish: $(buildContext)/k8s
      artifact: manifests

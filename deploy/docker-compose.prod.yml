version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-doctor_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-doctor_dashboard}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-doctor_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doctor-dashboard-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-dashboard-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-doctor_dashboard}
      DB_USER: ${DB_USER:-doctor_dashboard}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: 3000
    volumes:
      - upload_data:/app/data/uploads
      - logs_data:/app/logs
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - doctor-dashboard-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: doctor-dashboard-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - upload_data:/app/data/uploads:ro
    networks:
      - doctor-dashboard-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  logs_data:
    driver: local

networks:
  doctor-dashboard-network:
    driver: bridge
